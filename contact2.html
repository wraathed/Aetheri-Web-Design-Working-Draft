<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <nav>
        <div class="logo">@tysonfitzgerald</div>
        <ul class="nav-links">
            <!-- Updated Link -->
            <li><a href="portfolio.html">HOME</a></li>
            <li><a href="projects.html">PROJECTS</a></li>
            <li><a href="contact2.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="glow-text">CONTACT ME</h1>
        <p>Fill out the form below to send a message.</p>
        <br>

        <form class="contact-form" action="https://formspree.io/f/mpwlgrwj" method="POST">
    <div class="form-group">
        <label for="name">NAME:</label>
        <!-- Added name="name" -->
        <input type="text" id="name" name="name" required placeholder="Enter Name...">
    </div>

    <div class="form-group">
        <label for="email">EMAIL:</label>
        <!-- Added name="email" -->
        <input type="email" id="email" name="email" required placeholder="name@example.com">
    </div>

    <div class="form-group">
        <label for="message">MESSAGE:</label>
        <!-- Added name="message" -->
        <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
    </div>

    <!-- Optional: Keeps the redirect to thank-you.html if you have that page -->
    <input type="hidden" name="_next" value="thank-you.html">

    <!-- Optional: Makes the email subject line look nicer in your inbox -->
    <input type="hidden" name="_subject" value="New Data Packet Transmission">

    <button type="submit">SUBMIT</button>
</form>
    </div>

    <footer>
        &copy; 2025 Aetheri Web Design LLC.
    </footer>

    <script src="script2.js"></script>
</body>
</html>
