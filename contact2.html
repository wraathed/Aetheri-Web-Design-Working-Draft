<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <nav>
        <div class="logo">@tysonfitzgerald</div>
        <ul class="nav-links">
            <!-- Updated Link -->
            <li><a href="portfolio.html">HOME</a></li>
            <li><a href="projects.html">PROJECTS</a></li>
            <li><a href="contact2.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="glow-text">ESTABLISH UPLINK</h1>
        <p>Fill out the form below to transmit a message.</p>
        <br>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Transmission Sent Successfully.');">
            <div class="form-group">
                <label for="name">USER ID / NAME:</label>
                <input type="text" id="name" required placeholder="Enter Name...">
            </div>

            <div class="form-group">
                <label for="email">DIGITAL ADDRESS / EMAIL:</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="message">DATA PACKET / MESSAGE:</label>
                <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>
            </div>

            <button type="submit">TRANSMIT DATA</button>
        </form>
    </div>

    <footer>
        &copy; 2025 Aetheri Web Design LLC.
    </footer>

    <script src="script2.js"></script>
</body>
</html>
